services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-only
    volumes:
      - rag_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - ${RAG_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag-local-only@db:5432/rag
      DATA_DIR: /data/uploads
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-gigachat}
      GIGACHAT_CA_BUNDLE_FILE: /app/certs/russian_trusted_root_ca_pem.crt
    ports:
      - "8000:8000"
    volumes:
      - rag_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "rag_app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 4s
      start_period: 5s
      retries: 3
    env_file:
      - ${RAG_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag-local-only@db:5432/rag
      DATA_DIR: /data/uploads
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-gigachat}
      GIGACHAT_CA_BUNDLE_FILE: /app/certs/russian_trusted_root_ca_pem.crt
    volumes:
      - rag_uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_postgres:
  rag_uploads:
